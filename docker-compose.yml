version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: fitness_postgis
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: fitness_marketplace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: fitness_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata: